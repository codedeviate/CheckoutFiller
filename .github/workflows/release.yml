name: Release

# Build, test, and attach the packaged extension zips to a GitHub Release
# whenever a version tag (v*) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run package

      - name: Create release and upload zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/checkoutfiller-chrome-*.zip
            dist/checkoutfiller-firefox-*.zip
          generate_release_notes: true
